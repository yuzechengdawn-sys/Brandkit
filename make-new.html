    .chat-input-v2-container{position:relative;display:flex;height:128px;width:100%;flex-direction:column;border-radius:16px;font-family:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
    .chat-input-v2-editor-part{position:relative;z-index:1;box-sizing:border-box;width:100%;height:128px;min-height:128px;border:1px solid rgba(115,115,115,.18);border-radius:16px;background:#fff;box-shadow:0 3px 9px rgba(24,24,24,.06);transition:border-color .15s ease,box-shadow .15s ease}
    .agent-prompt:focus-within .chat-input-v2-editor-part{border-color:rgba(115,115,115,.36);box-shadow:0 6px 24px -1px rgba(24,24,24,.06)}
    .chat-input-v2-input-box-wrapper{position:relative;box-sizing:border-box;width:calc(100% - 2px);height:62px;min-height:62px;max-height:142px;margin:12px 2px 0 0;padding:0 14px 2px 16px;overflow:hidden;cursor:text}
    .agent-prompt textarea.chat-input-v2-input-box-editable{position:relative;z-index:2;display:block;width:100%;height:60px;min-height:40px;margin:0;padding:0;overflow:auto;border:0;outline:0;resize:none;background:transparent;color:#171717;font:500 13px/20px "SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
    .agent-prompt textarea.chat-input-v2-input-box-editable::placeholder{color:#a1a1a1;font-size:14px;font-weight:400;opacity:1}
    .chat-input-v2-editor-part-lower-content{display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;width:100%;height:52px;padding:8px 12px 12px;gap:6px}
    .chat-input-v2-editor-part-lower__left{display:flex;flex:1 1 auto;align-items:center;min-width:0;gap:4px}
    .chat-input-v2-editor-part-lower__mid{display:flex;flex:1 1 0;align-items:center;min-width:0;margin-left:6px}
    .chat-input-v2-editor-part-lower__right{display:flex;align-items:center;gap:4px}
    .core-model-select-trigger{display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;width:auto;height:32px;padding:2px 8px;gap:4px;overflow:hidden;border:0;border-radius:8px;outline:0;background:transparent;color:#404040;font:400 12px/18px "SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer;transition:background-color .15s ease,color .15s ease}
    .core-model-select-trigger:hover,.core-model-select-trigger:focus-visible{background:rgba(115,115,115,.12);color:#262626}
    .core-model-select-trigger span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .core-model-select-trigger svg{width:14px;height:14px;color:#737373}
    .messageInputToolbarIconBtn{display:flex;align-items:center;justify-content:center;box-sizing:border-box;width:32px;height:32px;padding:0;border:0;border-radius:8px;outline:0;background:transparent;color:#262626;cursor:pointer;transition:background-color .15s ease}
    .messageInputToolbarIconBtn:hover,.messageInputToolbarIconBtn:focus-visible{background:rgba(115,115,115,.12)}
    .messageInputToolbarIconBtn svg{width:16px;height:16px}
    .agent-context-mark{font:500 15px/1 "SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
    .agent-speed{display:flex;align-items:center;box-sizing:border-box;height:32px;padding:0 6px;gap:4px;border:0;border-radius:8px;background:transparent;color:#737373;font:400 12px/18px "SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer;transition:background-color .15s ease,color .15s ease}
    .agent-speed:hover,.agent-speed:focus-visible{background:rgba(115,115,115,.12);color:#262626}
    .agent-speed svg{width:15px;height:15px}
    .chat-input-v2-send-button{position:relative;display:flex;align-items:center;justify-content:center;box-sizing:border-box;width:32px;height:32px;margin:0;padding:3px;border:0;border-radius:8px;background:#18181b;color:#fff;cursor:pointer;transition:background-color .15s ease}
    .chat-input-v2-send-button:not(:disabled):hover{background:#2f2f33}
    .chat-input-v2-send-button:disabled,.chat-input-v2-send-button.disabled{background:#18181b;color:#fff;cursor:not-allowed}
    .chat-input-v2-send-button svg{width:16px;height:16px}
    .inputBarContainer-sSF0Pb{display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;width:100%;height:44px;padding:6px 12px;overflow:hidden}
    .inputBarLeft-eA7G5d,.inputBarRight-HAaHWC{display:flex;align-items:center;gap:6px}
    .inputBarButton-l_13bv{display:flex;align-items:center;box-sizing:border-box;height:32px;padding:6px 8px;gap:4px;border:0;border-radius:8px;background:transparent;color:#171717;font:400 14px/20px "SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer;transition:background-color .15s ease,color .15s ease}
    .inputBarButton-l_13bv:hover,.inputBarButton-l_13bv:focus-visible{background:rgba(115,115,115,.12);color:#262626}
    .inputBarButtonIcon-jYDzMT,.inputBarButtonArrow-LWv76z{display:flex;align-items:center;justify-content:center;width:16px;height:16px;flex:0 0 16px}
    .inputBarButtonIcon-jYDzMT svg,.inputBarButtonArrow-LWv76z svg{width:16px;height:16px}
    .inputBarButtonArrow-LWv76z{color:#737373}

    .agent-flow{display:flex;flex-direction:column;justify-content:center;width:min(1138px,100%);min-height:calc(100% - 36px);margin:0 auto;padding:44px 0 58px;overflow-x:auto;opacity:0;transform:translateY(12px);scrollbar-width:none;transition:opacity .34s cubic-bezier(.2,.8,.2,1),transform .34s cubic-bezier(.2,.8,.2,1)}
    .agent-flow::-webkit-scrollbar{display:none;width:0;height:0}
    .agent-flow.is-visible{opacity:1;transform:translateY(0)}
    .agent-flow.is-preparing{visibility:hidden;opacity:0;transform:none}
    .agent-canvas{position:relative;display:grid;grid-template-columns:220px 300px 270px 228px;column-gap:40px;align-items:start;width:1138px;min-height:390px;margin-inline:auto;padding-bottom:16px;flex:none}
    .agent-canvas::before,.agent-canvas::after{content:"";position:absolute;z-index:0;left:14px;right:8px;top:16px;height:2px;border-radius:2px;transform-origin:left center}
    .agent-canvas::before{background:#d8dbe5}
    .agent-canvas::after{background:#18181b;transform:scaleX(0);transition:transform 1.35s cubic-bezier(.2,.8,.2,1)}
    .agent-canvas.is-running::after,.agent-canvas.is-complete::after{transform:scaleX(1)}
    .agent-stage{position:relative;z-index:1;min-width:0;padding-top:61px}
    .agent-stage-chip{position:absolute;top:0;left:0;display:inline-flex;align-items:center;gap:6px;height:33px;padding:0 12px;border:1px solid #dfe1e7;border-radius:999px;background:#fff;color:#5f626b;font-size:11.5px;font-weight:600;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.035);transition:border-color .2s ease,color .2s ease}
    .agent-stage-chip svg{width:13px;height:13px;color:#18181b}
    .agent-stage.is-active .agent-stage-chip{border-color:#aaaab0;color:#18181b}

    .agent-request-card{display:flex;flex-direction:column;width:220px;height:150px;padding:16px;border:1px solid #dedee1;border-radius:14px;background:#fff;box-shadow:0 12px 28px rgba(24,24,27,.08);transition:opacity .22s ease,transform .32s cubic-bezier(.22,1,.36,1)}
    .agent-flow.is-morphing .agent-request-card{opacity:0;transform:scale(.985)}
    .agent-request-card p{display:-webkit-box;overflow:hidden;margin:0;color:#303034;font-size:13.5px;line-height:1.55;text-wrap:pretty;-webkit-box-orient:vertical;-webkit-line-clamp:5}
    .agent-request-meta{display:flex;align-items:center;gap:6px;margin-top:auto;color:#929299;font-size:10.5px}
    .agent-request-meta i{width:6px;height:6px;border-radius:50%;background:#18181b}

    .agent-step-list,.agent-check-list{display:grid;gap:9px;margin:0;padding:0;list-style:none}
    .agent-step{position:relative;display:grid;grid-template-columns:17px minmax(0,1fr);align-items:center;gap:8px;min-height:31px;padding:5px 10px;border:1px solid #e1e2e6;border-radius:9px;background:rgba(255,255,255,.82);color:#a0a1a7;font-size:11.5px;line-height:1.35;opacity:.58;transform:translateY(4px);transition:opacity .2s ease,transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s ease,color .2s ease,background .2s ease}
    .agent-step::before,.agent-check::before{content:"";display:grid;place-items:center;box-sizing:border-box;width:13px;height:13px;border:1.5px solid #c7cad4;border-radius:50%;background:transparent;color:transparent;font-size:9px;font-weight:700;line-height:1;opacity:1;transform:scale(1);transition:border-color .18s ease,background-color .18s ease,color .18s ease,opacity .18s ease,transform .22s cubic-bezier(.2,.9,.25,1.3)}
    .agent-step.is-current{opacity:1;transform:translateY(0);border-color:#babac0;color:#36363b;background:#f6f6f7}
    .agent-step.is-current::before{border-color:#18181b;border-top-color:transparent;animation:agent-spin .7s linear infinite}
    .agent-step.is-settling{opacity:1;transform:translateY(0);border-color:#babac0;color:#36363b;background:#f6f6f7}
    .agent-step.is-settling::before{animation:none;border-color:#18181b;background:transparent;color:transparent;opacity:.5;transform:scale(.78)}
    .agent-step.is-done{opacity:1;transform:translateY(0);border-color:#dedee2;color:#303036;background:#fff}
    .agent-step.is-done::before,.agent-check.is-passed::before{content:"✓";animation:agent-check-pop .28s cubic-bezier(.2,.9,.25,1.35) both;border-color:#18181b;background:#18181b;color:#fff;opacity:1;transform:scale(1)}
    .agent-sweep-label{display:block;min-width:0;min-height:1.35em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .agent-sweep-label.is-sweeping{overflow:visible;color:#18181b}
    .agent-ascii-sweep{position:relative;display:inline-block;max-width:100%;overflow:hidden;vertical-align:top;isolation:isolate}
    .agent-ascii-source,.agent-ascii-panel,.agent-ascii-output{position:absolute;inset:0;width:100%;height:100%}
    .agent-ascii-source{overflow:hidden}
    .agent-ascii-source.is-fallback{display:none}
    .agent-ascii-panel{display:flex;align-items:center;overflow:hidden;white-space:nowrap;font:inherit;line-height:inherit}
    .agent-ascii-output{z-index:2;display:block;pointer-events:none}
    .agent-sweep-glyph{display:inline-block;box-sizing:border-box;vertical-align:baseline;white-space:pre;text-align:center;font:inherit;will-change:color,opacity,text-shadow,transform}
    .agent-sweep-label.is-dissolving .agent-sweep-glyph{transition:color .22s ease,opacity .22s ease,text-shadow .22s ease,transform .22s ease}

    .agent-check-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:#777a83;font-size:11px}
    .agent-check-head b{color:#18181b;font-weight:600;font-variant-numeric:tabular-nums}
    .agent-check{position:relative;display:grid;grid-template-columns:16px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:39px;padding:7px 9px;border-bottom:1px solid #e6e6e8;color:#8e9097;font-size:11.5px;opacity:.48;transform:translateY(4px);transition:opacity .2s ease,transform .2s cubic-bezier(.2,.8,.2,1),color .2s ease}
    .agent-check-status{color:#18181b;font-size:10.5px;opacity:0;transition:opacity .18s ease}
    .agent-check.is-current{opacity:1;transform:translateY(0);color:#4b4d54}
    .agent-check.is-current::before{border-color:#18181b;border-top-color:transparent;animation:agent-spin .7s linear infinite}
    .agent-check.is-settling{opacity:1;transform:translateY(0);color:#41434a}
    .agent-check.is-settling::before{animation:none;border-color:#18181b;background:transparent;color:transparent;opacity:.5;transform:scale(.78)}
    .agent-check.is-passed{opacity:1;transform:translateY(0);color:#41434a}
    .agent-check.is-passed .agent-check-status{opacity:1}

    .agent-output{display:block;width:228px;aspect-ratio:531/588;margin:0;overflow:hidden;border:0;border-radius:10px;background:#efeff0;box-shadow:none;opacity:1;transform:none}
    .agent-output-link{display:block;width:100%;height:100%;border-radius:inherit;outline-offset:4px}
    .agent-output-visual{position:relative;width:100%;height:100%;overflow:hidden;border-radius:inherit;background:#efeff0}
    .agent-output img,.agent-output canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
    .agent-output img{z-index:0;object-fit:cover;opacity:0;transform:none;transition:opacity .72s cubic-bezier(.22,1,.36,1)}
    .agent-output canvas{z-index:1;pointer-events:none;opacity:0;transition:opacity .72s cubic-bezier(.22,1,.36,1)}
    .agent-output.is-pixelating canvas{opacity:1}
    .agent-output.is-ready img{opacity:1}
    .agent-output.is-ready canvas{opacity:0}
    .agent-flow-actions{display:flex;justify-content:flex-end;width:1138px;margin:14px auto 0;flex:none}
    .agent-reset{opacity:0;pointer-events:none;transition:opacity .2s ease}
    .agent-flow.is-complete .agent-reset{opacity:1;pointer-events:auto}
    @keyframes agent-spin{to{transform:rotate(360deg)}}
    @keyframes agent-check-pop{0%{opacity:0;transform:scale(.72)}100%{opacity:1;transform:scale(1)}}
    @keyframes agent-cursor-blink{0%,100%{opacity:1}50%{opacity:0}}

    @media (max-width:1180px){.agent-entry,.agent-flow{min-height:calc(100% - 36px)}}
    @media (max-width:700px){
      .agent-entry{min-height:390px;padding:36px 0 64px}.agent-entry-stack,.agent-prompt.messageInputContainer{width:100%}.agent-type-title{min-height:36px;font-size:26px;line-height:36px}
      .core-model-select-trigger{max-width:122px}.core-model-select-trigger span{max-width:92px}
      .inputBarContainer-sSF0Pb{padding-inline:8px}
      .agent-flow{display:block;width:100%;min-height:0;padding:30px 0 48px;overflow:visible}
      .agent-canvas{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;width:auto;min-height:0}
      .agent-canvas::before,.agent-canvas::after{left:16px;right:auto;top:15px;bottom:12px;width:2px;height:auto;transform-origin:center top}
      .agent-canvas::after{transform:scaleY(0)}.agent-canvas.is-running::after,.agent-canvas.is-complete::after{transform:scaleY(1)}
      .agent-stage{padding:0 0 0 42px}.agent-stage-chip{position:relative;top:auto;left:auto;margin-bottom:14px}
      .agent-flow-actions{width:auto}.agent-request-card{width:min(220px,100%)}
    }
    @media (prefers-reduced-motion:reduce){.agent-step.is-current::before,.agent-type-cursor{animation:none}.agent-type-cursor{display:none}}
  </style>
</head>
